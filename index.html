   h+='<div class="card pad" style="margin-bottom:10px"><div class="cols"><div><label>Name</label><input data-c="'+i+'.0" value="'+esc(c[0])+'"></div><div><label>Colour</label><input data-c="'+i+'.1" value="'+esc(c[1])+'"></div><div><label>Fuel</label><select class="f" data-c="'+i+'.2">'+["petrol","cng","diesel"].map(function(x){return '<option'+(x==c[2]?" selected":"")+'>'+x+'</option>'}).join("")+'</select></div><div><label>Type</label><input data-c="'+i+'.3" value="'+esc(c[3])+'"></div>'
   +[[4,"6 hr ₹ (0 = not offered)"],[5,"12 hr ₹"],[6,"24 hr ₹"],[7,"Extra hour ₹"]].map(function(f){return '<div><label>'+f[1]+'</label><input type="number" min="0" data-c="'+i+'.'+f[0]+'" value="'+c[f[0]]+'"></div>'}).join("")
   +'</div><label>Car photo</label>'+img(c[9],220)+'<input type="file" accept="image/*" data-u="car'+i+'"><label style="font-weight:400"><input type="checkbox" style="width:auto" data-a="'+i+'"'+(c[10]!=0?" checked":"")+'> Active (shown to customers)</label></div>'});
  h+='<button class="btn o" id="addc">+ Add car</button><h3 style="margin-top:18px">Offers</h3>';
  W.offers.forEach(function(o,i){h+='<div class="card pad" style="margin-bottom:8px"><b>'+esc(o.t)+'</b><br>'+esc(o.d)+'<br><button class="btn" data-d="'+i+'">Delete</button></div>'});
  h+='<div class="card pad"><label>New offer title</label><input id="ot"><label>Details</label><input id="od"><button class="btn y" id="addo">Add offer</button></div><p><button class="btn g" id="saveb">Save &amp; publish</button></p>';
  box.innerHTML=h;
  box.querySelectorAll("[data-c]").forEach(function(e){e.onchange=function(){var p=e.dataset.c.split(".");W.cars[p[0]][p[1]]=(p[1]>=4&&p[1]<=7)?(+e.value||0):e.value}});
  box.querySelectorAll("[data-a]").forEach(function(e){e.onchange=function(){W.cars[e.dataset.a][10]=e.checked?1:0}});
  box.querySelectorAll("[data-d]").forEach(function(e){e.onclick=function(){W.offers.splice(+e.dataset.d,1);draw()}});
  box.querySelectorAll("[data-u]").forEach(function(e){e.onchange=async function(){var f=e.files[0];if(!f)return;try{var k=e.dataset.u,b=k=="qr"?f:await shrink(f),r=await as.upload(b);if(k=="logo")W.logo=r.id;else if(k=="shop")W.shop=r.id;else if(k=="qr")W.qr=r.id;else if(k.slice(0,3)=="gal")W.gal[+k.slice(3)]=r.id;else W.cars[+k.slice(3)][9]=r.id;draw()}catch(x){alert("Upload failed: "+(x.message||x.code||x))}}});
  document.getElementById("addc").onclick=function(){W.cars.push(["New car","White","petrol","Hatchback",0,0,0,0,"#e9e6e1","",1]);draw()};
  document.getElementById("addo").onclick=function(){var a=ot.value.trim();if(!a)return;W.offers.push({t:a,d:od.value.trim()});draw()};
  document.getElementById("saveb").onclick=async function(){var b=this;try{b.disabled=true;var d=document.documentElement.cloneNode(true);["app","nav","foot"].forEach(function(i){d.querySelector("#"+i).innerHTML=""});var li=d.querySelector(".logo img");if(li)li.remove();d.querySelector("#st").textContent=JSON.stringify(W).replace(/</g,"\\u003c");d.removeAttribute("data-theme");d.setAttribute("lang","en");await ar.publish("<!DOCTYPE html>\n"+d.outerHTML)}catch(x){alert("Save failed: "+(x.message||x.code||x));b.disabled=false}}
 }
 draw()}
window.addEventListener("hashchange",route);route();
</script>
